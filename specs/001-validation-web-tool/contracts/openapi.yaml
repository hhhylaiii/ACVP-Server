openapi: 3.0.3
info:
  title: FIPS 203/204 Validation Web Tool API
  version: 0.1.0
  description: >
    REST contract for the self-hosted FIPS 203 (ML-KEM) / FIPS 204 (ML-DSA) validation
    web tool. The API wraps the existing Gen/Val engine (IGenValInvoker) backed by the
    Orleans Silo. Generation and validation run as background jobs polled for status.
    No IUT source code or private keys are ever requested or stored.
servers:
  - url: /api
    description: Same-origin API served alongside the SPA

paths:
  /capabilities:
    get:
      summary: List supported algorithms, modes, and parameter sets
      operationId: getCapabilities
      responses:
        "200":
          description: Supported selection matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /check:
    post:
      summary: Validate an algorithm configuration (synchronous, fast)
      operationId: checkParameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlgorithmConfiguration"
      responses:
        "200":
          description: Configuration is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/SafeError"

  /generate:
    post:
      summary: Start a generation job for a configuration
      operationId: startGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlgorithmConfiguration"
      responses:
        "202":
          description: Generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/SafeError"

  /jobs/{jobId}:
    get:
      summary: Poll job status
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/SafeError"

  /jobs/{jobId}/prompt-package:
    get:
      summary: Download the generated prompt package (prompt + example responses + instructions)
      operationId: getPromptPackage
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Prompt package archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          description: Job not yet succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeError"

  /validate:
    post:
      summary: Upload a response file and start a validation job
      operationId: startValidate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [jobId, responses]
              properties:
                jobId:
                  type: string
                  description: The generate job whose prompt these responses answer
                responses:
                  type: string
                  format: binary
                  description: The IUT-produced responses.json
      responses:
        "202":
          description: Validation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/SafeError"
        "413":
          description: Upload exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeError"

  /jobs/{jobId}/report:
    get:
      summary: Get the validation report for a completed validation job
      operationId: getReport
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          $ref: "#/components/responses/SafeError"
        "409":
          description: Job not yet succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeError"

  /jobs/{jobId}/validation-json:
    get:
      summary: Download the machine-readable validation.json
      operationId: getValidationJson
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: validation.json
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/SafeError"

components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string

  responses:
    SafeError:
      description: A safe, non-leaking error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SafeError"

  schemas:
    Capabilities:
      type: object
      properties:
        algorithms:
          type: array
          items:
            type: object
            properties:
              algorithm:
                type: string
                enum: [ML-KEM, ML-DSA]
              modes:
                type: array
                items:
                  type: string
              parameterSets:
                type: array
                items:
                  type: string

    AlgorithmConfiguration:
      type: object
      required: [algorithm, mode, parameterSets]
      properties:
        algorithm:
          type: string
          enum: [ML-KEM, ML-DSA]
        mode:
          type: string
          enum: [keyGen, encapDecap, sigGen, sigVer]
        parameterSets:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ML-KEM-512, ML-KEM-768, ML-KEM-1024, ML-DSA-44, ML-DSA-65, ML-DSA-87]
        advancedOptions:
          type: object
          nullable: true
          description: ML-DSA only; safe defaults applied when omitted

    CheckResult:
      type: object
      properties:
        valid:
          type: boolean
        messages:
          type: array
          items:
            type: string

    Job:
      type: object
      required: [jobId, kind, status]
      properties:
        jobId:
          type: string
        vsId:
          type: integer
          format: int64
        kind:
          type: string
          enum: [generate, validate]
        status:
          type: string
          enum: [Queued, Running, Succeeded, Failed]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        error:
          $ref: "#/components/schemas/SafeError"

    ValidationReport:
      type: object
      required: [jobId, disposition, summary, cases]
      properties:
        jobId:
          type: string
        disposition:
          type: string
          enum: [passed, failed]
        summary:
          type: object
          properties:
            total:
              type: integer
            passed:
              type: integer
            failed:
              type: integer
        cases:
          type: array
          items:
            type: object
            properties:
              tcId:
                type: integer
              passed:
                type: boolean
              reason:
                type: string
                nullable: true

    SafeError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_CONFIGURATION
            - UNSUPPORTED_SELECTION
            - MISSING_FIELD
            - UNKNOWN_TCID
            - MISMATCHED_VECTORSET
            - UPLOAD_TOO_LARGE
            - ENGINE_UNAVAILABLE
            - JOB_NOT_FOUND
            - JOB_NOT_READY
            - MALFORMED_UPLOAD
            - UNEXPECTED_ERROR
        message:
          type: string
          description: Safe, human-readable; never contains stack traces
        tcId:
          type: integer
          nullable: true
        field:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
